<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Meu Treino</title>
<style>
  :root {
    --bg: #F3F1EC; --bg-elev: #FFFFFF; --bg-sunk: #ECE8DD;
    --ink: #1B1B18; --ink-soft: #5B584F; --ink-faint: #8C887C;
    --line: #DCD8CC; --accent: #B8862E; --accent-ink: #FFFFFF; --accent-soft: rgba(184,134,46,.14);
    --solo: #2F5D50; --super: #A5462F; --fin: #6B4FA0; --ok: #2F7D4F; --warn: #B4532A;
    --fig: #24231F; --equip: #6E6A60; --prop: #D9D4C7;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 0 rgba(0,0,0,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171A; --bg-elev: #202125; --bg-sunk: #2A2B30;
      --ink: #EDEAE1; --ink-soft: #A6A296; --ink-faint: #77746B;
      --line: #34353A; --accent: #D9A441; --accent-ink: #16171A; --accent-soft: rgba(217,164,65,.16);
      --solo: #6FAE9B; --super: #E28563; --fin: #A98BE0; --ok: #6CC08F; --warn: #E5895F;
      --fig: #ECE8DE; --equip: #A8A396; --prop: #3A3B41;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171A; --bg-elev: #202125; --bg-sunk: #2A2B30;
    --ink: #EDEAE1; --ink-soft: #A6A296; --ink-faint: #77746B;
    --line: #34353A; --accent: #D9A441; --accent-ink: #16171A; --accent-soft: rgba(217,164,65,.16);
    --solo: #6FAE9B; --super: #E28563; --fin: #A98BE0; --ok: #6CC08F; --warn: #E5895F;
    --fig: #ECE8DE; --equip: #A8A396; --prop: #3A3B41;
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }
  input, select, textarea { font: inherit; color: var(--ink); }

  header.top { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; display: flex; align-items: flex-end; gap: 10px; }
  header.top .tt { flex: 1; min-width: 0; }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
  header.top p { margin: 3px 0 0; color: var(--ink-soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goal-chip { font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; border: 0; }

  main { flex: 1; overflow-y: auto; padding: 14px 16px 120px; -webkit-overflow-scrolling: touch; }
  .view { display: none; }
  .view.active { display: block; }

  .card { background: var(--bg-elev); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .sec-title { font-size: 12px; font-weight: 800; color: var(--ink-soft); margin: 22px 2px 8px; text-transform: uppercase; letter-spacing: .6px; }
  .muted { color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }

  .btn { display: block; width: 100%; border: none; border-radius: 12px; padding: 14px 16px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn.accent { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.small { padding: 10px 12px; font-size: 13px; }
  .btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
  .btn:active { transform: scale(.985); }
  .pill { border: 1px solid var(--line); background: var(--bg-elev); border-radius: 99px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }

  /* Hoje */
  .next-card { background: var(--accent); color: var(--accent-ink); border-radius: 20px; padding: 18px 18px 16px; display: flex; gap: 14px; align-items: center; }
  .next-card .letter { font-size: 64px; font-weight: 900; line-height: .9; letter-spacing: -2px; }
  .next-card .lbl { font-size: 12px; opacity: .85; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .next-card .nm { font-size: 19px; font-weight: 800; margin: 2px 0; }
  .next-card .meta { font-size: 12.5px; opacity: .9; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg-elev); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .stat span { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }
  .tip { border-left: 3px solid var(--accent); }
  .hist-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .hist-row:last-child { border-bottom: 0; }
  .badge { display: inline-flex; width: 28px; height: 28px; border-radius: 8px; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; background: var(--bg-sunk); color: var(--ink); flex-shrink: 0; }
  .badge.cardio { background: var(--accent-soft); color: var(--accent); font-size: 15px; }
  .empty { color: var(--ink-soft); font-size: 14px; padding: 6px 0; }
  .banner { background: var(--bg-elev); border: 1.5px dashed var(--accent); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }

  /* Treino */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  .seg button { border: 1px solid var(--line); background: var(--bg-elev); border-radius: 12px; padding: 8px 4px; cursor: pointer; text-align: center; }
  .seg button b { display: block; font-size: 18px; font-weight: 900; }
  .seg button span { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button.on { background: var(--ink); border-color: var(--ink); }
  .seg button.on b, .seg button.on span { color: var(--bg); }
  .seg button .nx { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-left: 3px; }
  .w-head { margin: 4px 2px 12px; }
  .w-head h2 { margin: 0; font-size: 18px; }
  .block { margin-bottom: 14px; padding-left: 10px; border-left: 3px solid var(--solo); }
  .block.super { border-left-color: var(--super); }
  .block.fin { border-left-color: var(--fin); }
  .block-tag { font-size: 11px; font-weight: 800; color: var(--solo); margin: 0 0 6px; display: block; text-transform: uppercase; letter-spacing: .5px; }
  .super .block-tag { color: var(--super); }
  .fin .block-tag { color: var(--fin); }
  .ex-card { background: var(--bg-elev); border-radius: 16px; padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .ex-top { display: flex; gap: 12px; }
  .fig-box { width: 124px; height: 93px; flex-shrink: 0; border-radius: 12px; background: var(--bg-sunk); position: relative; overflow: hidden; cursor: pointer; }
  .fig-box.big { width: 100%; height: auto; aspect-ratio: 4 / 3; }
  .fig-label { position: absolute; right: 6px; bottom: 4px; font-size: 9.5px; color: var(--ink-faint); font-weight: 700; }
  svg.fig { width: 100%; height: 100%; display: block; }
  svg.fig .lim { stroke: var(--fig); stroke-width: 5.2; stroke-linecap: round; fill: none; }
  svg.fig .body { stroke: var(--fig); stroke-width: 7; stroke-linecap: round; }
  svg.fig .far { opacity: .38; }
  svg.fig .head { fill: var(--fig); }
  svg.fig .hl { stroke: var(--accent); stroke-width: 4.6; stroke-linecap: round; }
  svg.fig .hl.far { opacity: .45; }
  svg.fig .eq { fill: var(--equip); }
  svg.fig .eqh { fill: var(--bg-sunk); }
  svg.fig .plate { fill: none; stroke: var(--equip); stroke-width: 3.2; }
  svg.fig .eqbar { stroke: var(--equip); stroke-linecap: round; }
  svg.fig .eqplate { stroke: var(--equip); stroke-linecap: butt; }
  svg.fig .cable { stroke: var(--ink-faint); stroke-width: 1.2; }
  svg.fig .floor { stroke: var(--prop); stroke-width: 2; }
  svg.fig .prop { fill: var(--prop); }
  svg.fig .propl { stroke: var(--prop); stroke-linecap: round; }
  svg.fig .propc { fill: none; stroke: var(--prop); stroke-width: 3; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-weight: 800; font-size: 15px; line-height: 1.25; }
  .ex-mus { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .presc { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .presc span { font-size: 11.5px; font-weight: 700; background: var(--bg-sunk); border-radius: 6px; padding: 3px 7px; }
  .presc span.r { color: var(--ink-soft); }
  .sug { font-size: 12.5px; margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); line-height: 1.4; }
  .sug b { color: var(--accent); }
  .sug.up b { color: var(--ok); }
  .sets { margin-top: 10px; }
  .set-row { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 6px; align-items: center; margin-top: 6px; }
  .set-row .n { font-size: 12px; font-weight: 800; color: var(--ink-faint); text-align: center; }
  .set-row input { width: 100%; min-width: 0; background: var(--bg-sunk); border: 1px solid transparent; border-radius: 10px; padding: 10px 8px; font-size: 15px; text-align: center; font-weight: 700; }
  .set-row input:focus { outline: none; border-color: var(--accent); }
  .set-row input::placeholder { color: var(--ink-faint); font-weight: 500; }
  .set-row .ck { height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; font-size: 18px; font-weight: 900; color: var(--ink-faint); cursor: pointer; }
  .set-row.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
  .set-row.done input { color: var(--ok); }
  .set-head { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 6px; font-size: 10.5px; font-weight: 800; color: var(--ink-faint); text-align: center; text-transform: uppercase; letter-spacing: .4px; }
  .ex-actions { display: flex; gap: 6px; margin-top: 10px; }
  .ex-actions button { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .last-line { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; }

  /* Exercícios */
  .lib-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .lib-item { background: var(--bg-elev); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); cursor: pointer; }
  .lib-item .fig-box { width: 100%; height: auto; aspect-ratio: 4 / 3; }
  .lib-item b { display: block; font-size: 13px; margin: 7px 2px 1px; line-height: 1.25; }
  .lib-item span { font-size: 11px; color: var(--ink-soft); margin: 0 2px; display: block; }

  /* Progresso */
  .chart { width: 100%; display: block; }
  .chart text { fill: var(--ink-faint); font-size: 10px; }
  .chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .chart .ln2 { fill: none; stroke: var(--ink-faint); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .chart .dt { fill: var(--accent); }
  .chart .gr { stroke: var(--line); stroke-width: 1; }
  .meas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .delta { font-size: 11.5px; font-weight: 700; }
  .delta.good { color: var(--ok); }
  .delta.bad { color: var(--warn); }
  select.sel { width: 100%; background: var(--bg-sunk); border: 1px solid var(--line); border-radius: 10px; padding: 11px 10px; font-size: 14px; }
  .log-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .log-row:last-child { border-bottom: 0; }
  .log-row .sets-txt { color: var(--ink-soft); text-align: right; }

  /* Perfil */
  .opt { display: block; width: 100%; text-align: left; background: var(--bg-elev); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .opt b { display: block; font-size: 14.5px; }
  .opt span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; display: block; margin-top: 3px; }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .field { display: block; margin-top: 10px; }
  .field > span { font-size: 12px; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 5px; }
  .field input, .field textarea, .field select { width: 100%; background: var(--bg-sunk); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 15px; }
  .field textarea { min-height: 90px; font-size: 12px; font-family: monospace; }

  /* Sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg); border-radius: 22px 22px 0 0; max-height: 88vh; overflow-y: auto; padding: 8px 16px 28px; transform: translateY(105%); transition: transform .25s ease; }
  .sheet.on { transform: none; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
  .sheet h2 { margin: 12px 0 2px; font-size: 20px; }
  .cues { margin: 10px 0 0; padding: 0; list-style: none; counter-reset: c; }
  .cues li { position: relative; padding: 8px 0 8px 32px; font-size: 14px; line-height: 1.4; border-bottom: 1px solid var(--line); counter-increment: c; }
  .cues li:last-child { border-bottom: 0; }
  .cues li::before { content: counter(c); position: absolute; left: 0; top: 7px; width: 22px; height: 22px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .alt-item { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: var(--bg-elev); margin-bottom: 8px; cursor: pointer; }
  .alt-item .fig-box { width: 84px; height: 63px; }
  .alt-item b { font-size: 14px; display: block; }
  .alt-item span { font-size: 12px; color: var(--ink-soft); }
  .alt-item .tag { font-size: 10.5px; font-weight: 800; color: var(--accent); }

  /* Timer */
  .timer { position: fixed; left: 12px; right: 12px; bottom: 74px; z-index: 30; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 12px 10px 16px; display: none; align-items: center; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .timer.on { display: flex; }
  .timer .tl { font-size: 11px; font-weight: 700; opacity: .7; text-transform: uppercase; }
  .timer .tv { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .timer button { background: rgba(127,127,127,.25); border: 0; color: var(--bg); border-radius: 10px; padding: 9px 12px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .timer .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); border-radius: 0 0 0 16px; }
  .toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast.on { opacity: 1; }

  /* Nav */
  nav.tabs { display: flex; background: var(--bg-elev); border-top: 1px solid var(--line); padding: 6px 4px 8px; flex-shrink: 0; position: relative; z-index: 20; }
  nav.tabs button { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; color: var(--ink-faint); font-size: 10.5px; font-weight: 700; cursor: pointer; }
  nav.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.active { color: var(--ink); }
  nav.tabs button.active .ic { background: var(--accent-soft); color: var(--accent); }
  nav.tabs .ic { border-radius: 99px; padding: 3px 14px; display: flex; }
</style>
</head>
<body>

<header class="top">
  <div class="tt"><h1 id="pageTitle">Hoje</h1><p id="pageSub"></p></div>
  <button class="goal-chip" id="goalChip"></button>
</header>

<main id="main">
  <section class="view active" id="v-hoje"></section>
  <section class="view" id="v-treino"></section>
  <section class="view" id="v-prog"></section>
  <section class="view" id="v-lib"></section>
  <section class="view" id="v-perfil"></section>
</main>

<div class="timer" id="timer">
  <div class="grow"><div class="tl" id="timerLbl">Descanso</div><div class="tv" id="timerVal">0:00</div></div>
  <button id="tMinus">−15</button><button id="tPlus">+15</button><button id="tSkip">Pular</button>
  <div class="bar" id="timerBar"></div>
</div>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<nav class="tabs">
  <button data-view="hoje" class="active"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Hoje</button>
  <button data-view="treino"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg></span>Treino</button>
  <button data-view="prog"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg></span>Progresso</button>
  <button data-view="lib"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.5v6M12 13.5l-3.5 6M12 13.5l3.5 6M7 10.5l5-1.5 5 1.5"/></svg></span>Exercícios</button>
  <button data-view="perfil"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Perfil</button>
</nav>

<script src="fig.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
